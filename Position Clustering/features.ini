# The stats the positional clustering scripts use.
#
# One stat per line. Every stat listed here is used; put a # at the start of a line to leave that
# stat out. Notes after a stat on the same line (after #) are ignored. Stats with no data for the
# seasons being clustered (e.g. kick-ins before 2021) are skipped automatically.
#
# The sections say how each stat is turned into one number per player per season. They only
# group the stats for reading: moving a stat to another section doesn't change how it's worked out.
# Pass a different file with --features, e.g. --features myFeatures.ini, to try another selection.


[counting stats]
# Season total / season time on ground: a rate per full game played
kicks
handballs
# disposals                     # duplicate of kicks and handballs, left out to avoid double counting
marks
goals
behinds
hitouts
tackles
rebound_50s
inside_50s
clearances
clangers
frees_for
frees_against
# brownlow_votes                # award outcome: left out so roles don't depend on the awards
contested_possessions
uncontested_possessions
contested_marks
marks_inside_50
one_percenters
bounces
goal_assists
super_goals                     # no data in the database yet
total_possessions
# dream_team_points             # rating: left out so roles don't depend on the awards
# rating_points                 # rating: left out so roles don't depend on the awards
turnovers
intercepts
tackles_inside_50
shots_at_goal
score_involvements
metres_gained
centre_clearances
stoppage_clearances
effective_kicks
effective_disposals
marks_on_lead
intercept_marks
hitouts_to_advantage
ground_ball_gets
f50_ground_ball_gets            # ground ball gets inside forward 50
score_launches
pressure_acts
def_half_pressure_acts          # pressure acts in the defensive half
spoils
ruck_contests
contest_def_one_on_ones         # one-on-one contests as the defender
contest_def_losses
contest_off_one_on_ones         # one-on-one contests as the forward
contest_off_wins
centre_bounce_attendances       # 2021 onwards
kickins                         # 2021 onwards
kickins_playon                  # 2021 onwards


[percentages and ratios]
# Season average, weighted by time on ground
disposal_efficiency
# goal_accuracy
# goal_efficiency                 # no data in the database yet
# shot_efficiency                 # no data in the database yet
# kick_efficiency
kick_to_handball_ratio
contested_possession_rate
hitout_win_percentage
hitout_to_advantage_rate
contest_def_loss_percentage
contest_off_wins_percentage


[per-game averages]
# Plain season average, not scaled by time on ground
time_on_ground_percentage
# time_on_ground_seconds
# time_on_bench_seconds
# interchange_count
# power_rating                    # only recorded for some players
# age                             # age in years on game day
# captain                         # share of games as captain; barely recorded in the database
# subbed_on                       # share of games subbed on
# subbed_off                      # share of games subbed off
# won                             # share of games won


[player attributes]
height
weight


[named positions]
# Share of games named in each team-sheet position (left and right sides merged)
# named_FF                        # full forward
# named_FP                        # forward pocket
# named_CHF                       # centre half-forward
# named_HFF                       # half-forward flank
# named_C                         # centre
# named_W                         # wing
# named_RK                        # ruck
# named_R                         # rover
# named_RR                        # ruck-rover
# named_CHB                       # centre half-back
# named_HBF                       # half-back flank
# named_FB                        # full back
# named_BP                        # back pocket
# named_INT                       # interchange
# named_SUB                       # substitute
